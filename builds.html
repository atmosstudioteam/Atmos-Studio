<html lang="en" data-language="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Browse Atmos Studio Minecraft modpacks, current Boosty builds, public Modrinth and CurseForge releases, and project information."
    >

    <meta name="theme-color" content="#0d1117">

    <title>Builds — Atmos Studio</title>

    <style>
        :root {
            color-scheme: dark;

            --background: #0d1117;
            --surface: #161b22;
            --surface-secondary: #1d2430;
            --surface-highlight: #232b38;

            --border: #30363d;

            --text: #e6edf3;
            --muted: #9da7b3;

            --accent: #8b5cf6;
            --accent-secondary: #a78bfa;
            --accent-bright: #c4a7ff;

            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;

            --shadow:
                0 18px 45px rgba(0, 0, 0, 0.25);

            --shadow-large:
                0 26px 70px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 110px;
        }

        body {
            margin: 0;

            background:
                radial-gradient(
                    circle at 8% 0%,
                    rgba(139, 92, 246, 0.18),
                    transparent 34rem
                ),
                radial-gradient(
                    circle at 92% 18%,
                    rgba(91, 70, 180, 0.08),
                    transparent 30rem
                ),
                var(--background);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 16px;
            line-height: 1.7;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;
            z-index: -1;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px
                );

            background-size: 48px 48px;

            mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.75),
                    transparent 72%
                );
        }

        a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;
        }

        .page {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 80px;
        }

        /* ========================================================= */
        /* TOP NAVIGATION                                            */
        /* ========================================================= */

        .site-header {
            position: sticky;
            top: 12px;
            z-index: 100;

            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;

            margin-bottom: 22px;
            padding: 12px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: rgba(22, 27, 34, 0.92);

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .studio-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            min-height: 44px;
            padding: 0 12px;

            color: var(--text);

            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.035em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .studio-brand:hover {
            color: var(--accent-secondary);
        }

        .brand-mark {
            width: 13px;
            height: 13px;
            flex: 0 0 auto;

            border-radius: 4px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent-secondary),
                    var(--accent)
                );

            box-shadow:
                0 0 18px rgba(139, 92, 246, 0.8);
        }

        .page-navigation {
            display: flex;
            justify-content: center;
            gap: 6px;

            padding: 5px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: rgba(13, 17, 23, 0.58);
        }

        .navigation-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 40px;
            padding: 7px 14px;

            border: 1px solid transparent;
            border-radius: 9px;

            color: var(--muted);

            font-size: 0.9rem;
            font-weight: 750;
            white-space: nowrap;

            transition:
                background 160ms ease,
                border-color 160ms ease,
                color 160ms ease,
                transform 160ms ease;
        }

        .navigation-tab:hover {
            color: var(--text);
            background: var(--surface-secondary);
            transform: translateY(-1px);
        }

        .navigation-tab.active {
            border-color: rgba(139, 92, 246, 0.68);

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 92, 246, 0.25),
                    rgba(139, 92, 246, 0.12)
                );

            color: var(--accent-bright);

            box-shadow:
                inset 0 0 0 1px rgba(167, 139, 250, 0.08),
                0 6px 20px rgba(88, 55, 160, 0.18);
        }

        .social-navigation {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-height: 44px;
            padding: 8px 13px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--surface-secondary);
            color: var(--text);

            font-size: 0.89rem;
            font-weight: 750;
            white-space: nowrap;

            transition:
                transform 160ms ease,
                border-color 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .social-button svg {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            fill: currentColor;
        }

        .social-button:hover {
            transform: translateY(-1px);
        }

        .social-button.discord {
            color: #b9bfff;
        }

        .social-button.discord:hover {
            border-color: rgba(88, 101, 242, 0.75);
            background: rgba(88, 101, 242, 0.14);

            box-shadow:
                0 8px 22px rgba(88, 101, 242, 0.15);
        }

        .social-button.telegram {
            color: #83d8ff;
        }

        .social-button.telegram:hover {
            border-color: rgba(34, 158, 217, 0.75);
            background: rgba(34, 158, 217, 0.13);

            box-shadow:
                0 8px 22px rgba(34, 158, 217, 0.14);
        }

        /* ========================================================= */
        /* HERO                                                      */
        /* ========================================================= */

        .hero {
            position: relative;
            overflow: hidden;

            padding: 58px;

            border: 1px solid var(--border);
            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 92, 246, 0.2),
                    rgba(22, 27, 34, 0.97) 62%,
                    rgba(18, 23, 31, 0.98)
                );

            box-shadow: var(--shadow-large);
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 430px;
            height: 430px;

            right: -140px;
            top: -185px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, 0.25),
                    transparent 68%
                );

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;

            max-width: 820px;
        }

        .hero-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 20px;

            color: var(--accent-secondary);

            font-weight: 800;
            letter-spacing: 0.045em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 20px;

            font-size: clamp(3rem, 8vw, 5.4rem);
            line-height: 0.98;
            letter-spacing: -0.055em;
        }

        .hero-description {
            max-width: 760px;
            margin: 0;

            color: #b4bdca;

            font-size: clamp(1.02rem, 2.3vw, 1.18rem);
        }

        .metadata {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-top: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            min-height: 36px;
            padding: 6px 13px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(13, 17, 23, 0.58);
            color: var(--muted);

            font-size: 0.9rem;
        }

        .badge-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 10px rgba(63, 185, 80, 0.6);
        }

        /* ========================================================= */
        /* SECTIONS                                                  */
        /* ========================================================= */

        .section-divider {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 18px;

            margin: 64px 0 34px;

            color: #b8c2d1;

            font-size: 0.91rem;
            font-weight: 850;
            letter-spacing: 0.075em;
            text-transform: uppercase;
        }

        .section-divider::before,
        .section-divider::after {
            content: "";
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--border)
                );
        }

        .section-divider::after {
            background:
                linear-gradient(
                    90deg,
                    var(--border),
                    transparent
                );
        }

        .section-divider span {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 34px;
            padding: 5px 14px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface);
        }

        .content-section {
            padding: 42px;

            border: 1px solid var(--border);
            border-radius: 22px;

            background: rgba(22, 27, 34, 0.92);

            box-shadow: var(--shadow);
        }

        .section-heading {
            max-width: 820px;
            margin-bottom: 30px;
        }

        .section-kicker {
            margin: 0 0 7px;

            color: var(--accent-secondary);

            font-size: 0.83rem;
            font-weight: 800;
            letter-spacing: 0.075em;
            text-transform: uppercase;
        }

        h2 {
            margin: 0 0 12px;

            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1.12;
            letter-spacing: -0.035em;
        }

        h3 {
            margin: 0 0 10px;

            font-size: 1.3rem;
            line-height: 1.3;
        }

        h4 {
            margin: 0;
            font-size: 1rem;
        }

        p {
            margin: 12px 0;
        }

        .section-description {
            margin: 0;

            color: var(--muted);
            font-size: 1.02rem;
        }

        /* ========================================================= */
        /* BUILD CARD                                                */
        /* ========================================================= */

        .build-card {
            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 43, 56, 0.94),
                    rgba(24, 30, 40, 0.94)
                );
        }

        .build-banner {
            position: relative;
            overflow: hidden;

            min-height: 245px;
            padding: 34px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            border-bottom: 1px solid var(--border);

            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(139, 92, 246, 0.38),
                    transparent 26rem
                ),
                linear-gradient(
                    135deg,
                    rgba(88, 55, 160, 0.32),
                    rgba(18, 23, 31, 0.96)
                );
        }

        .build-banner::after {
            content: "CONFLUX";

            position: absolute;
            right: 22px;
            top: 12px;

            color: rgba(255, 255, 255, 0.035);

            font-size: clamp(4rem, 13vw, 9rem);
            font-weight: 900;
            letter-spacing: -0.07em;

            pointer-events: none;
        }

        .build-banner-content {
            position: relative;
            z-index: 1;

            max-width: 720px;
