            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            font-size: 16px;
            line-height: 1.7;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;
            z-index: -1;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px

                    90deg,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px

            background-size: 48px 48px;

            mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.75),
                    transparent 72%

        a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;

        .page {

            gap: 16px;

            padding: 12px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: rgba(22, 27, 34, 0.92);

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .studio-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            min-height: 44px;
            padding: 0 12px;

            color: var(--text);

            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.035em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .studio-brand:hover {
            color: var(--accent-secondary);
        }

        .brand-mark {
            width: 13px;
            height: 13px;
            flex: 0 0 auto;

            border-radius: 4px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent-secondary),
                    var(--accent)
                );

            box-shadow:
                0 0 18px rgba(139, 92, 246, 0.8);
        }

        .page-navigation {
            display: flex;
            justify-content: center;
            gap: 6px;

            padding: 5px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: rgba(13, 17, 23, 0.58);
        }

        .navigation-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 40px;
            padding: 7px 14px;

            border: 1px solid transparent;
            border-radius: 9px;

            color: var(--muted);

            font-size: 0.9rem;
            font-weight: 750;
            white-space: nowrap;

            transition:
                background 160ms ease,
                border-color 160ms ease,
                color 160ms ease,
                transform 160ms ease;
        }

        .navigation-tab:hover {
            color: var(--text);
            background: var(--surface-secondary);
            transform: translateY(-1px);
        }

        .navigation-tab.active {
            border-color: rgba(139, 92, 246, 0.68);

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 92, 246, 0.25),
                    rgba(139, 92, 246, 0.12)

            box-shadow:

            color: var(--text);

            font-size: 0.89rem;
            font-weight: 750;
            white-space: nowrap;

            transition:
                transform 160ms ease,
                border-color 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .social-button svg {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            fill: currentColor;
        }

        .social-button:hover {
            transform: translateY(-1px);
        }

        .social-button.discord {
            color: #b9bfff;
        }

        .social-button.telegram {

        }

            background: rgba(34, 158, 217, 0.13);

            box-shadow:
                0 8px 22px rgba(34, 158, 217, 0.14);
        }

        /* LANGUAGE NAVIGATION                                       */

        .language-panel {

            font-size: 0.88rem;

        /* ========================================================= */
        /* LANGUAGE DIVIDERS                                         */

        .language-divider {

        .hero {

        .hero::before {

            pointer-events: none;
